<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Agent Canvas Trace Observer Wireframe</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #f6f7f9; color: #17202a; }
      main { display: grid; grid-template-columns: 280px 1fr 360px; min-height: 100vh; }
      aside, section { padding: 16px; border-right: 1px solid #d8dde3; }
      .bar { height: 40px; border: 1px solid #d8dde3; border-radius: 8px; background: white; margin-bottom: 12px; }
      .event { height: 56px; border: 1px solid #d8dde3; border-radius: 8px; background: white; margin-bottom: 8px; }
      .detail { height: 160px; border: 1px solid #d8dde3; border-radius: 8px; background: white; margin-bottom: 12px; }
    </style>
  </head>
  <body>
    <main>
      <aside>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </aside>
      <section>
        <div class="event"></div>
        <div class="event"></div>
        <div class="event"></div>
      </section>
      <aside>
        <div class="detail"></div>
        <div class="detail"></div>
      </aside>
    </main>
  </body>
</html>
