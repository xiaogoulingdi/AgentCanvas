<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Canvas Trace Observer</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --surface: #ffffff;
        --surface-muted: #eef1f4;
        --border: #d8dde3;
        --text: #17202a;
        --muted: #647181;
        --accent: #176b87;
        --accent-soft: #d9eef4;
        --success: #277c52;
        --warning: #a86409;
        --danger: #b42318;
        --code: #111827;
        --radius: 8px;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button, textarea, select { font: inherit; }

      .app {
        display: grid;
        grid-template-columns: minmax(240px, 300px) minmax(380px, 1fr) minmax(300px, 420px);
        min-height: 100vh;
      }

      .panel {
        min-width: 0;
        padding: 16px;
        border-right: 1px solid var(--border);
      }

      .panel:last-child { border-right: 0; }

      .title {
        margin: 0 0 12px;
        font-size: 18px;
        line-height: 1.25;
      }

      .subtle {
        color: var(--muted);
        font-size: 12px;
      }

      textarea {
        width: 100%;
        min-height: 180px;
        resize: vertical;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--code);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 12px;
        line-height: 1.45;
      }

      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 10px 0 14px;
      }

      .stack {
        display: grid;
        gap: 8px;
      }

      button, select {
        min-height: 34px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--text);
      }

      button {
        padding: 0 12px;
        cursor: pointer;
      }

      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: white;
      }

      select {
        width: 100%;
        padding: 0 10px;
      }

      .metric {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
      }

      .metric strong { font-weight: 650; }

      .timeline {
        display: grid;
        gap: 8px;
      }

      .event {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        text-align: left;
      }

      .event.active {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .event-head {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        min-width: 0;
      }

      .event-type {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        font-weight: 650;
      }

      .badge {
        flex: 0 0 auto;
        padding: 2px 7px;
        border-radius: 999px;
        background: var(--surface-muted);
        color: var(--muted);
        font-size: 11px;
      }

      .badge.allow, .badge.completed { color: var(--success); background: #e4f4eb; }
      .badge.ask, .badge.running, .badge.unknown { color: var(--warning); background: #fff2dc; }
      .badge.deny, .badge.failed { color: var(--danger); background: #fde8e5; }

      .event-copy {
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .detail {
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        margin-bottom: 12px;
      }

      pre {
        max-height: 320px;
        overflow: auto;
        margin: 0;
        padding: 12px;
        border-radius: var(--radius);
        background: var(--code);
        color: #f9fafb;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 12px;
        line-height: 1.45;
      }

      .artifact {
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }

      .artifact:last-child { border-bottom: 0; }

      .error {
        display: none;
        padding: 10px;
        border: 1px solid #f1b8b2;
        border-radius: var(--radius);
        background: #fde8e5;
        color: var(--danger);
        font-size: 13px;
      }

      .empty {
        padding: 20px;
        border: 1px dashed var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--muted);
        text-align: center;
      }

      @media (max-width: 980px) {
        .app {
          grid-template-columns: 1fr;
        }
        .panel {
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <aside class="panel">
        <h1 class="title">Trace Observer</h1>
        <p class="subtle">Load local runs from <code>npm.cmd run trace:serve</code>, or paste JSON from <code>run:inspect --json</code>.</p>
        <div class="stack">
          <select id="runSelect" aria-label="Run list">
            <option value="">No runs loaded</option>
          </select>
          <div class="toolbar">
            <button class="primary" id="refreshButton">Refresh</button>
            <button id="loadRunButton">Load Run</button>
          </div>
        </div>
        <textarea id="jsonInput" spellcheck="false" aria-label="Trace JSON input"></textarea>
        <div class="toolbar">
          <button id="loadButton">Load JSON</button>
          <button id="sampleButton">Sample</button>
        </div>
        <div class="error" id="errorBox"></div>
        <div id="summary"></div>
      </aside>

      <section class="panel">
        <div class="toolbar">
          <select id="typeFilter" aria-label="Filter events">
            <option value="all">All events</option>
          </select>
        </div>
        <div class="timeline" id="timeline">
          <div class="empty">No trace loaded.</div>
        </div>
      </section>

      <aside class="panel">
        <h2 class="title">Detail</h2>
        <div class="detail" id="eventDetail">
          <div class="empty">Select an event.</div>
        </div>
        <h2 class="title">Artifacts</h2>
        <div class="detail" id="artifactList">
          <div class="empty">No artifacts.</div>
        </div>
      </aside>
    </main>

    <script>
      const state = {
        trace: null,
        selectedEventId: null,
        filter: "all"
      };

      const sampleTrace = {
        sessionId: "session_sample",
        status: "completed",
        estimatedUsd: 0.002,
        artifacts: [
          { id: "artifact_report", kind: "report", title: "OpenCode coder result", content: "OK" },
          {
            id: "artifact_patch",
            kind: "patch",
            title: "OpenCode coder diff",
            content: "### README.md\\n\\n```diff\\n-old\\n+new\\n```",
            metadata: { source: "opencode", opencodeSessionId: "ses_sample", diffs: [{ file: "README.md", additions: 1, deletions: 1 }] }
          }
        ],
        events: [
          { id: "event_prompt", type: "user.prompt.submitted", sessionId: "session_sample", timestamp: "2026-06-29T00:00:00.000Z", prompt: "Reply with OK only." },
          { id: "event_policy", type: "permission.policy.loaded", sessionId: "session_sample", timestamp: "2026-06-29T00:00:01.000Z", source: "opencode-tool-policy", defaultDecision: "deny", policy: { edit: "deny", bash: "deny" } },
          { id: "event_session", type: "backend.session.observed", sessionId: "session_sample", timestamp: "2026-06-29T00:00:02.000Z", nodeId: "coder", backend: "opencode", externalSessionId: "ses_sample", status: "completed", messageCount: 2, diffCount: 1 },
          { id: "event_perm", type: "permission.checked", sessionId: "session_sample", timestamp: "2026-06-29T00:00:03.000Z", nodeId: "coder", scope: "filesystem.patch", decision: "ask", reason: "Scope filesystem.patch matched configured static policy." },
          { id: "event_artifact", type: "artifact.created", sessionId: "session_sample", timestamp: "2026-06-29T00:00:04.000Z", nodeId: "coder", artifact: { id: "artifact_report", kind: "report", title: "OpenCode coder result", content: "OK" } }
        ]
      };

      document.getElementById("loadButton").addEventListener("click", () => loadTrace(document.getElementById("jsonInput").value));
      document.getElementById("refreshButton").addEventListener("click", refreshRuns);
      document.getElementById("loadRunButton").addEventListener("click", loadSelectedRun);
      document.getElementById("sampleButton").addEventListener("click", () => {
        document.getElementById("jsonInput").value = JSON.stringify(sampleTrace, null, 2);
        loadTrace(document.getElementById("jsonInput").value);
      });
      document.getElementById("typeFilter").addEventListener("change", (event) => {
        state.filter = event.target.value;
        render();
      });
      refreshRuns();

      async function refreshRuns() {
        try {
          const response = await fetch("/api/runs?limit=50", { cache: "no-store" });
          if (!response.ok) throw new Error(`Run API unavailable (${response.status}). Start with: npm.cmd run trace:serve`);
          const payload = await response.json();
          const runs = Array.isArray(payload.runs) ? payload.runs : [];
          const select = document.getElementById("runSelect");
          select.innerHTML = runs.length === 0
            ? '<option value="">No runs found</option>'
            : runs.map((run) => `<option value="${escapeHtml(run.sessionId)}">${escapeHtml(run.updatedAt)} · ${escapeHtml(run.engineId ?? "unknown")} · ${escapeHtml(run.workflowName ?? run.workflowId ?? "unknown")}</option>`).join("");
          if (runs[0]) await loadRun(runs[0].sessionId);
        } catch (error) {
          showError(error instanceof Error ? error.message : String(error));
        }
      }

      async function loadSelectedRun() {
        const sessionId = document.getElementById("runSelect").value;
        if (!sessionId) return;
        await loadRun(sessionId);
      }

      async function loadRun(sessionId) {
        try {
          const response = await fetch(`/api/runs/${encodeURIComponent(sessionId)}`, { cache: "no-store" });
          if (!response.ok) throw new Error(`Run ${sessionId} unavailable (${response.status}).`);
          const trace = await response.json();
          document.getElementById("jsonInput").value = JSON.stringify(trace, null, 2);
          applyTrace(trace);
        } catch (error) {
          showError(error instanceof Error ? error.message : String(error));
        }
      }

      function loadTrace(raw) {
        try {
          const parsed = JSON.parse(raw);
          applyTrace(parsed);
        } catch (error) {
          showError(error instanceof Error ? error.message : String(error));
        }
      }

      function applyTrace(parsed) {
        if (!Array.isArray(parsed.events)) throw new Error("Trace JSON must include an events array.");
        state.trace = parsed;
        state.selectedEventId = parsed.events[0]?.id ?? null;
        state.filter = "all";
        document.getElementById("errorBox").style.display = "none";
        renderFilters();
        render();
      }

      function showError(message) {
        const box = document.getElementById("errorBox");
        box.textContent = message;
        box.style.display = "block";
      }

      function renderFilters() {
        const filter = document.getElementById("typeFilter");
        const types = [...new Set((state.trace?.events ?? []).map((event) => event.type))].sort();
        filter.innerHTML = '<option value="all">All events</option>' + types.map((type) => `<option value="${escapeHtml(type)}">${escapeHtml(type)}</option>`).join("");
        filter.value = state.filter;
      }

      function render() {
        renderSummary();
        renderTimeline();
        renderDetail();
        renderArtifacts();
      }

      function renderSummary() {
        const summary = document.getElementById("summary");
        const trace = state.trace;
        if (!trace) {
          summary.innerHTML = "";
          return;
        }
        summary.innerHTML = [
          metric("Session", trace.sessionId ?? "unknown"),
          metric("Status", trace.status ?? "unknown"),
          metric("Estimated USD", Number(trace.estimatedUsd ?? 0).toFixed(4)),
          metric("Events", String(trace.events?.length ?? 0)),
          metric("Artifacts", String(trace.artifacts?.length ?? 0))
        ].join("");
      }

      function renderTimeline() {
        const timeline = document.getElementById("timeline");
        const events = filteredEvents();
        if (events.length === 0) {
          timeline.innerHTML = '<div class="empty">No matching events.</div>';
          return;
        }
        timeline.innerHTML = events.map((event) => eventButton(event)).join("");
        timeline.querySelectorAll("[data-event-id]").forEach((button) => {
          button.addEventListener("click", () => {
            state.selectedEventId = button.getAttribute("data-event-id");
            render();
          });
        });
      }

      function renderDetail() {
        const detail = document.getElementById("eventDetail");
        const event = (state.trace?.events ?? []).find((item) => item.id === state.selectedEventId);
        if (!event) {
          detail.innerHTML = '<div class="empty">Select an event.</div>';
          return;
        }
        detail.innerHTML = `<pre>${escapeHtml(JSON.stringify(event, null, 2))}</pre>`;
      }

      function renderArtifacts() {
        const list = document.getElementById("artifactList");
        const artifacts = state.trace?.artifacts ?? [];
        if (artifacts.length === 0) {
          list.innerHTML = '<div class="empty">No artifacts.</div>';
          return;
        }
        list.innerHTML = artifacts.map((artifact) => `
          <div class="artifact">
            <div><strong>${escapeHtml(artifact.title)}</strong> <span class="badge">${escapeHtml(artifact.kind)}</span></div>
            <div class="subtle">${escapeHtml(artifact.id)}</div>
            <div class="event-copy">${escapeHtml(summarizeArtifact(artifact))}</div>
          </div>
        `).join("");
      }

      function filteredEvents() {
        const events = state.trace?.events ?? [];
        if (state.filter === "all") return events;
        return events.filter((event) => event.type === state.filter);
      }

      function eventButton(event) {
        const active = event.id === state.selectedEventId ? " active" : "";
        const badge = statusBadge(event);
        return `
          <button class="event${active}" data-event-id="${escapeHtml(event.id)}">
            <div class="event-head">
              <span class="event-type">${escapeHtml(event.type)}</span>
              ${badge}
            </div>
            <div class="event-copy">${escapeHtml(eventSummary(event))}</div>
          </button>
        `;
      }

      function statusBadge(event) {
        const value = event.decision ?? event.status ?? event.artifact?.kind ?? "";
        if (!value) return "";
        return `<span class="badge ${escapeHtml(String(value))}">${escapeHtml(String(value))}</span>`;
      }

      function eventSummary(event) {
        if (event.type === "backend.session.observed") return `${event.nodeId} ${event.backend}/${event.externalSessionId} messages=${event.messageCount} diffs=${event.diffCount}`;
        if (event.type === "permission.checked") return `${event.nodeId} ${event.scope} -> ${event.decision}`;
        if (event.type === "model.route.selected") return `${event.nodeId} -> ${event.selectedModel}`;
        if (event.type === "artifact.created") return `${event.artifact.kind}: ${event.artifact.title}`;
        if (event.type === "model.request.completed") return `${event.nodeId} ${event.model}: ${String(event.content ?? "").slice(0, 80)}`;
        if (event.type === "workflow.failed") return event.message;
        return event.nodeId ?? event.workflowId ?? event.engineId ?? event.prompt ?? event.timestamp ?? "";
      }

      function summarizeArtifact(artifact) {
        const diffs = artifact.metadata?.diffs;
        if (Array.isArray(diffs) && diffs.length > 0) return diffs.map((diff) => `${diff.file} +${diff.additions ?? 0} -${diff.deletions ?? 0}`).join(", ");
        return String(artifact.content ?? "").replace(/\\s+/g, " ").slice(0, 140);
      }

      function metric(label, value) {
        return `<div class="metric"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }
    </script>
  </body>
</html>
